input {
  file {
    path => "/data/movies_dataset.csv"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    tags => ["clean"]
  }
}

filter {
  if "clean" in [tags] {
    csv {
      separator => ","
      skip_header => true
      columns => ["movie_id", "title", "original_language", "release_date", "popularity", "vote_average", "vote_count", "overview"]
    }

    if [movie_id] == "index" or [movie_id] == "" {
      drop { }
    }

    mutate {
      convert => {
        "movie_id" => "integer"
        "popularity" => "float"
        "vote_average" => "float"
        "vote_count" => "integer"
      }
    }

    mutate {
      strip => ["title", "overview"]
      lowercase => ["original_language"]
    }

    if [overview] and [overview] != "" {
      mutate { add_field => { "has_overview" => true } }
    } else {
      mutate { add_field => { "has_overview" => false } }
      mutate { add_field => { "quality_tags" => "missing_overview" } }
    }

    if [vote_count] < 100 {
      mutate { add_field => { "is_rating_reliable" => false } }
      mutate { add_field => { "quality_tags" => "low_vote_count" } }
    } else {
      mutate { add_field => { "is_rating_reliable" => true } }
    }

    if [release_date] and [release_date] != "" {
      mutate { add_field => { "has_release_date" => true } }
      
      date {
        match => ["release_date", "dd-MM-yyyy"]
        target => "release_date"
      }
      
      ruby {
        code => "
          rd = event.get('release_date')
          if rd
            event.set('release_year', rd.time.year)
            if rd.time > Time.new(2026, 5, 4)
              event.set('is_future_release', true)
              tags = event.get('quality_tags')
              if tags.nil?
                event.set('quality_tags', ['future_release'])
              elsif tags.is_a?(Array)
                event.set('quality_tags', tags + ['future_release'])
              else
                event.set('quality_tags', [tags, 'future_release'])
              end
            else
              event.set('is_future_release', false)
            end
          end
        "
      }
    } else {
      mutate { add_field => { "has_release_date" => false } }
      mutate { add_field => { "quality_tags" => "missing_release_date" } }
      mutate { add_field => { "is_future_release" => false } }
    }

    mutate {
      convert => {
        "has_overview" => "boolean"
        "has_release_date" => "boolean"
        "is_rating_reliable" => "boolean"
        "is_future_release" => "boolean"
      }
    }

    mutate {
      add_field => { "ingested_at" => "%{@timestamp}" }
      remove_field => ["message", "host", "@version", "event", "log", "file"]
    }
  }
}

output {
  if "clean" in [tags] {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_HOSTS:http://elasticsearch:9200}"] # Sécurité: variable d'environnement
      index => "movies_clean"
      document_id => "%{movie_id}"
    }
    stdout {
      codec => dots
    }
  }
}
